# One-time reviewed source patch; remove after successful application.
name: apply-native-portability

on:
  push:
    branches:
      - agent/pqm-runtime-platform
    paths:
      - '.github/workflows/apply-native-portability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/pqm-runtime-platform
          fetch-depth: 0
      - name: Apply compiler-portability fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "native/tls-gateway/CMakeLists.txt",
              "\ntarget_compile_definitions(pqm-tls-gateway PRIVATE\n  _FORTIFY_SOURCE=3\n)\n",
              "\n",
          )
          replace_once(
              "native/tls-gateway/pqm_tls_gateway.c",
              "        unsigned short waiting = 0;\n",
              "        short waiting = 0;\n",
          )
          replace_once(
              "native/tls-gateway/pqm_tls_gateway.c",
              "            waiting |= POLLIN;\n",
              "            waiting = (short)(waiting | POLLIN);\n",
          )
          replace_once(
              "native/tls-gateway/pqm_tls_gateway.c",
              "            waiting |= POLLOUT;\n",
              "            waiting = (short)(waiting | POLLOUT);\n",
          )
          replace_once(
              "native/tls-gateway/pqm_tls_gateway.c",
              "            waiting |= POLLIN | POLLOUT;\n",
              "            waiting = (short)(waiting | POLLIN | POLLOUT);\n",
          )
          PY
          git diff --check
      - name: Commit portability changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pqm-security-bot'
          git config user.email 'pqm-security-bot@users.noreply.github.com'
          git add native/tls-gateway/CMakeLists.txt native/tls-gateway/pqm_tls_gateway.c
          git commit -m 'fix(native): resolve fortify and poll event portability warnings'
          git push origin HEAD:agent/pqm-runtime-platform
