name: runtime-platform

on:
  push:
    branches:
      - main
      - agent/pqm-runtime-platform
    paths:
      - 'cmd/**'
      - 'internal/runtime/**'
      - 'native/**'
      - 'java/migration-provider/**'
      - 'runtime-tests/**'
      - 'deploy/**'
      - '.github/workflows/runtime.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/runtime/**'
      - 'native/**'
      - 'java/migration-provider/**'
      - 'runtime-tests/**'
      - 'deploy/**'
      - '.github/workflows/runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSSL_VERSION: 3.5.7
  OPENSSL_ROOT: /opt/openssl-3.5

jobs:
  go:
    name: Go control plane
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.x'
          cache: false
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Run race-enabled tests
        run: go test -race ./...
      - name: Run static analysis
        run: go vet ./...
      - name: Build runtime executables
        run: go build ./cmd/runtime-controller ./cmd/gateway-agent ./cmd/telemetry-reporter ./cmd/recrypt-worker ./cmd/emergency-sign

  native:
    name: OpenSSL and PKCS#11 data plane
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc make perl libp11-kit-dev
      - name: Build verified OpenSSL 3.5 LTS release
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}"
          curl -fsSLO "${base}/openssl-${OPENSSL_VERSION}.tar.gz"
          curl -fsSLO "${base}/openssl-${OPENSSL_VERSION}.tar.gz.sha256"
          sha256sum -c "openssl-${OPENSSL_VERSION}.tar.gz.sha256"
          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure --prefix="${OPENSSL_ROOT}" --openssldir="${OPENSSL_ROOT}/ssl" shared no-tests
          make -j2
          sudo make install_sw
          echo "${OPENSSL_ROOT}/lib64" | sudo tee /etc/ld.so.conf.d/openssl-3.5.conf
          sudo ldconfig
          "${OPENSSL_ROOT}/bin/openssl" version
      - name: Build native components with strict warnings
        shell: bash
        env:
          PATH: /opt/openssl-3.5/bin:${{ env.PATH }}
          LD_LIBRARY_PATH: /opt/openssl-3.5/lib64:/opt/openssl-3.5/lib
          PKG_CONFIG_PATH: /opt/openssl-3.5/lib64/pkgconfig:/opt/openssl-3.5/lib/pkgconfig
        run: |
          set -euo pipefail
          cmake -S native/tls-gateway -B build/tls -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT}"
          cmake --build build/tls --parallel 2
          cmake -S native/pkcs11-proxy -B build/pkcs11 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/pkcs11 --parallel 2
      - name: Exercise hybrid TLS gateway
        shell: bash
        env:
          PATH: /opt/openssl-3.5/bin:${{ env.PATH }}
          LD_LIBRARY_PATH: /opt/openssl-3.5/lib64:/opt/openssl-3.5/lib
          GATEWAY: ./build/tls/pqm-tls-gateway
        run: ./runtime-tests/tls_gateway_smoke.sh
      - name: Exercise ML-KEM envelope encryption
        shell: bash
        env:
          PATH: /opt/openssl-3.5/bin:${{ env.PATH }}
          LD_LIBRARY_PATH: /opt/openssl-3.5/lib64:/opt/openssl-3.5/lib
        run: ./runtime-tests/recrypt_smoke.sh

  java:
    name: Java migration provider
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14.3'
      - name: Run provider tests
        working-directory: java/migration-provider
        shell: bash
        run: |
          set +e
          gradle test --no-daemon --stacktrace
          status=$?
          if test "$status" -ne 0; then
            find build/test-results/test -maxdepth 1 -type f -name '*.xml' -print -exec cat {} \; || true
          fi
          exit "$status"
