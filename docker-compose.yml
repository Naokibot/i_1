services:
  observatory:
    build: .
    environment:
      PQM_API_TOKEN: ${PQM_API_TOKEN:?set a random token of at least 32 characters}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./:/workspace:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
