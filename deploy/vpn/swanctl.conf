connections {
  legacy-inbound {
    version = 2
    local_addrs = 192.0.2.10
    remote_addrs = 192.0.2.20
    proposals = aes256gcm16-prfsha384-x25519
    local {
      auth = pubkey
      certs = legacy-gateway.pem
      id = legacy-gateway.example
    }
    remote {
      auth = pubkey
      id = legacy-peer.example
    }
    children {
      legacy-in {
        local_ts = 10.20.0.0/16
        remote_ts = 10.10.0.0/16
        start_action = trap
        dpd_action = restart
      }
    }
  }

  pqc-outbound {
    version = 2
    local_addrs = 198.51.100.10
    remote_addrs = 198.51.100.20
    proposals = aes256gcm16-prfsha384-x25519-ke1_mlkem768
    local {
      auth = pubkey
      certs = pqc-gateway.pem
      id = pqc-gateway-a.example
    }
    remote {
      auth = pubkey
      id = pqc-gateway-b.example
    }
    children {
      pqc-out {
        local_ts = 10.10.0.0/16
        remote_ts = 10.30.0.0/16
        start_action = start
        dpd_action = restart
      }
    }
  }
}

secrets {
  private-legacy { file = legacy-gateway-key.pem }
  private-pqc { file = pqc-gateway-key.pem }
}
